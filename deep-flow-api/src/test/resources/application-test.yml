spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ZnJvbV9kZWVwX2Zsb3dfYXBwbGljYXRpb25fYmFja2VuZF9zZWNyZXRfa2V5XzEyMzQ1Njc4OTAxMjM0NTY3ODkw
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 604800

app:
  cors:
    allowed-origins: http://localhost:3000
  auth:
    cookie:
      secure: false
      same-site: Lax
      max-age: 604800
  rate-limit:
    # 통합 테스트는 rate-limit 의 영향을 받지 않도록 사실상 무제한
    normal-rate-limit: 100000
    write-operation-cost: 1
    session-start-cost: 1
    read-operation-cost: 1
  r2:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test
    public-url: http://localhost:9000/test

logging:
  level:
    org.hibernate.SQL: debug
    org.testcontainers: info
