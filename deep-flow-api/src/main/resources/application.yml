spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          connectionMinimumIdleSize: 5
          connectionPoolSize: 20
          timeout: 1000
          retryAttempts: 1
          retryInterval: 500

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 604800

app:
  search:
    engine: ${SEARCH_ENGINE:mysql}
  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:true}
      batch-size: 50
      max-retry: 3
  cors:
    allowed-origins: http://localhost:3000
  auth:
    cookie:
      secure: false
      same-site: Lax
      max-age: ${APP_AUTH_COOKIE_MAX_AGE:604800}
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET:deep-flow}
    public-url: ${R2_PUBLIC_URL}
  async:
    core-pool-size: 5
    max-pool-size: 30
    queue-capacity: 50
  cache:
    ttl-minutes: 60
    version: v1
  rate-limit:
    normal-rate-limit: ${APP_RATE_LIMIT_NORMAL:100}
    penalty-rate-limit: ${APP_RATE_LIMIT_PENALTY:10}
    penalty-threshold: ${APP_RATE_LIMIT_PENALTY_THRESHOLD:50}
    bucket-expiry-minutes: ${APP_RATE_LIMIT_BUCKET_EXPIRY:10}
    refill-period-minutes: ${APP_RATE_LIMIT_REFILL_PERIOD:1}
    violation-expiry-minutes: ${APP_RATE_LIMIT_VIOLATION_EXPIRY:1}
    session-start-cost: ${APP_RATE_LIMIT_SESSION_START_COST:10}
    write-operation-cost: ${APP_RATE_LIMIT_WRITE_COST:5}
    read-operation-cost: ${APP_RATE_LIMIT_READ_COST:1}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true