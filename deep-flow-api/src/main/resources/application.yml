spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          connectionMinimumIdleSize: 5
          connectionPoolSize: 20
          timeout: 1000
          retryAttempts: 1
          retryInterval: 500

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 604800

app:
  cors:
    allowed-origins: http://localhost:3000
  auth:
    cookie:
      secure: false
      same-site: Lax
      max-age: ${APP_AUTH_COOKIE_MAX_AGE:604800}
  async:
    core-pool-size: 5
    max-pool-size: 30
    queue-capacity: 50
  cache:
    ttl-minutes: 60
    version: v1
  rate-limit:
    normal-rate-limit: 100
    penalty-rate-limit: 10
    penalty-threshold: 50
    bucket-expiry-minutes: 10
    refill-period-minutes: 1
    violation-expiry-minutes: 1
    session-start-cost: 10
    write-operation-cost: 5
    read-operation-cost: 1

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true